[project]
name = "farms-on-the-move"
version = "0.1.0"
description = "Satellite-derived crop stress trends for Central California, published as an interactive map for farmers."
requires-python = ">=3.11"
dependencies = [
    # Planet Insights Platform / Sentinel Hub APIs (Statistical, Catalog, Process)
    "sentinelhub>=3.10",
    # Planet classic Data/Orders/Subscriptions APIs (PlanetScope scene ordering)
    "planet>=2.10",
    # geospatial
    "geopandas>=1.0",
    "pyogrio>=0.9",
    "shapely>=2.0",
    "pyproj>=3.6",
    # analysis
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "pymannkendall>=1.4.3",
    # plumbing
    "requests>=2.32",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "pytest>=8.0", "jupyterlab>=4.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/farms_on_the_move"]

[tool.ruff]
line-length = 100
